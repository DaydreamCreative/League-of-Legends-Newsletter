name: preview-edition

on:
  schedule:
    - cron: "0 20 * * 4"   # Thursday 20:00 UTC = noon Pacific Standard Time, before TNF
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Write the Thursday preview
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          BEAT_COLUMN: preview
        run: python beat_reporter.py
      - name: Publish to the blog
        run: |
          git config user.name "league-beat-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add docs
          git commit -m "New preview" || echo "nothing new"
          git push
